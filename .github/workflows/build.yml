name: Build Codeg Manager

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy Go modules
        run: go mod tidy

      - name: Run tests
        run: |
          go test ./... -v

      - name: Vet
        run: go vet ./...

      - name: Build for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          # produce a smaller, stripped binary
          go build -ldflags="-s -w" -o RTKron.exe ./cmd/rtkron

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTKron-windows
          path: RTKron.exe
