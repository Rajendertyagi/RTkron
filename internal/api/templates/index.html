<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-highlight: #334155;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--bg-highlight);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-header {
            padding: 0 24px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--bg-highlight);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 400;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
            background-color: rgba(56, 189, 248, 0.1);
            border-right: 3px solid var(--accent);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
        }

        .btn {
            background-color: var(--accent);
            color: var(--bg-base);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--bg-highlight);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .card .value {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 10px 0 0 0;
            color: var(--text-primary);
        }
        
        .card .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px var(--success);
        }

        /* Recent Activity Table */
        .table-container {
            margin-top: 40px;
            background-color: var(--bg-surface);
            border: 1px solid var(--bg-highlight);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--bg-highlight);
            font-weight: 600;
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--bg-highlight);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.success {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge.pending {
            background-color: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            RTKron
        </div>
        <a href="/" class="nav-link active">Dashboard</a>
        <a href="#" class="nav-link">Workflows</a>
        <a href="#" class="nav-link">Schedules</a>
        <a href="#" class="nav-link">Audit Logs</a>
        <a href="#" class="nav-link">Settings</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Control Center</h1>
            <button class="btn">New Workflow</button>
        </div>

        <div class="grid">
            <div class="card">
                <h3>System Status</h3>
                <div class="value"><span class="indicator"></span> Healthy</div>
            </div>
            <div class="card">
                <h3>Active Workflows</h3>
                <div class="value">0</div>
            </div>
            <div class="card">
                <h3>Events Processed (24h)</h3>
                <div class="value">0</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">Recent Activity</div>
            <table>
                <thead>
                    <tr>
                        <th>Event ID</th>
                        <th>Workflow</th>
                        <th>Status</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Placeholder data until API is fully wired -->
                    <tr>
                        <td style="color: var(--text-muted);">No activity recorded yet.</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
      let last = null;
      setInterval(async () => {
        try {
          const res = await fetch('/healthz', {cache: 'no-store'});
          if (res.ok) {
            const now = Date.now();
            if (last && now - last > 3000) {
              window.location.reload();
            }
            last = now;
          }
        } catch (e) {
          // ignore
        }
      }, 2000);
    </script>
</body>
</html>
